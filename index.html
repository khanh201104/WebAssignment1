<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Assignment 01</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f8;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #fff;
            max-width: 460px;
            width: 100%;
            padding: 32px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            text-align: center;
        }
        .tag {
            display: inline-block;
            background: #e6f4ea;
            color: #137333;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        h1 { font-size: 22px; margin-bottom: 6px; color: #111; }
        p.sub { font-size: 14px; color: #666; margin-bottom: 24px; }
        .details {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 16px;
            text-align: left;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .footer-note { font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="card">
        <span class="tag">TEST</span>
        <h1>Phạm Quốc Khánh</h1>
        <p class="sub">Trường Công nghệ Thông tin và Truyền thông</p>

        <div class="details">
            <div><strong>MSSV:</strong> 20225138</div>
            <div><strong>Bài tập:</strong> Assignment 01</div>
            <div><strong>Kì học:</strong> 2026.1</div>
        </div>

        <p class="footer-note">Phạm Quốc Khánh</p>
    </div>
</body>
</html>
